name: kompliance

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kompliance_app_example
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KOMPLIANCE_APP_AUTH: "1"
      KOMPLIANCE_SCHEDULER: "${KOMPLIANCE_SCHEDULER:-0}"
      KOMPLIANCE_SCHEDULER_INTERVAL_SECONDS: "${KOMPLIANCE_SCHEDULER_INTERVAL_SECONDS:-3600}"
      KOMPLIANCE_EMAIL_DELIVERY: "${KOMPLIANCE_EMAIL_DELIVERY:-0}"
      KOMPLIANCE_BASE_URL: "${KOMPLIANCE_BASE_URL:-}"
      KOMPLIANCE_SMTP_HOST: "${KOMPLIANCE_SMTP_HOST:-}"
      KOMPLIANCE_SMTP_PORT: "${KOMPLIANCE_SMTP_PORT:-587}"
      KOMPLIANCE_SMTP_SECURITY: "${KOMPLIANCE_SMTP_SECURITY:-starttls}"
      KOMPLIANCE_SMTP_USERNAME: "${KOMPLIANCE_SMTP_USERNAME:-}"
      KOMPLIANCE_SMTP_PASSWORD: "${KOMPLIANCE_SMTP_PASSWORD:-}"
      KOMPLIANCE_SMTP_FROM: "${KOMPLIANCE_SMTP_FROM:-}"
      KOMPLIANCE_COMPLIANCE_RECIPIENT: "${KOMPLIANCE_COMPLIANCE_RECIPIENT:-}"
      KOMPLIANCE_PRIVACY_CONTACT: "${KOMPLIANCE_PRIVACY_CONTACT:-}"
    expose:
      - "8090"
    volumes:
      - ./source-archive:/app/source-archive:ro
      - kompliance_data_example:/app/local-app/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  gateway:
    image: nginx:stable-alpine
    container_name: kompliance_gateway_example
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/htpasswd:/etc/nginx/htpasswd:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  kompliance_data_example:
    name: kompliance_data_example

networks:
  proxy:
    external: true
    name: proxy

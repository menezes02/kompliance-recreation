name: kompliance-local-validation

services:
  app:
    image: kompliance-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kompliance_app_example
    restart: "no"
    environment:
      PYTHONUNBUFFERED: "1"
      KOMPLIANCE_APP_AUTH: "1"
      KOMPLIANCE_LOGIN_LOCKOUT_ENABLED: "${KOMPLIANCE_LOGIN_LOCKOUT_ENABLED:-1}"
      KOMPLIANCE_SCHEDULER: "0"
      KOMPLIANCE_EMAIL_DELIVERY: "0"
      KOMPLIANCE_WORKER_EMAIL_VERIFICATION: "0"
    ports:
      - "127.0.0.1:18090:8090"
    volumes:
      - ./source-archive:/app/source-archive:ro
      - kompliance_data_example:/app/local-app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  operations:
    image: kompliance-app
    container_name: kompliance_operations_example
    restart: "no"
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "/app/ops_kompliance.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      KOMPLIANCE_AUTOMATED_BACKUPS: "1"
      KOMPLIANCE_BACKUP_INTERVAL_SECONDS: "86400"
      KOMPLIANCE_MONITOR_INTERVAL_SECONDS: "30"
      KOMPLIANCE_READY_URL: "http://app:8090/api/health/ready"
    volumes:
      - kompliance_data_example:/app/local-app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  kompliance_data_example:
    name: kompliance_data_example
